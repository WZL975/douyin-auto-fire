name: Sync Upstream

on:
  schedule:
    # 北京时间每天 04:17，避开整点调度高峰
    - cron: "17 4 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      force:
        description: Run full validation when upstream is current; do not publish without updates
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/unmev/douyin-auto-fire.git
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Remember current main
        id: base
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::main 在任务开始前已经发生变化，本次同步退出，不使用旧 checkout 推送。"
            exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp scripts/resolve_sync_conflicts.py "$RUNNER_TEMP/resolve_sync_conflicts.py"

      - name: Check for upstream updates
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            if git merge-base --is-ancestor upstream/main HEAD; then
              echo "has_updates=false" >> "$GITHUB_OUTPUT"
              echo "validate=true" >> "$GITHUB_OUTPUT"
              echo "手动强制验证：上游没有新提交，执行完整恢复和测试，但不发布。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "has_updates=true" >> "$GITHUB_OUTPUT"
              echo "手动强制检查：执行完整合并、测试和推送流程。" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，跳过同步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游有新提交，开始合并并测试。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep public schedule alive when needed
        if: steps.check.outputs.has_updates == 'false' && steps.check.outputs.validate != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: python3 scripts/keepalive.py --base-sha "$BASE_SHA"

      - name: Merge upstream with upstream code preferred
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        shell: bash
        run: |
          if git merge --no-commit --no-edit --no-ff -X theirs upstream/main; then
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              echo "merged=false" >> "$GITHUB_OUTPUT"
              echo "强制检查没有形成新的 merge，跳过发布。" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            if python3 "$RUNNER_TEMP/resolve_sync_conflicts.py" \
              --repo-root "$GITHUB_WORKSPACE" \
              --base-sha "${{ steps.base.outputs.base_sha }}" &&
              [[ -z "$(git diff --name-only --diff-filter=U)" ]] &&
              git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
            else
              git merge --abort || true
              echo "merged=false" >> "$GITHUB_OUTPUT"
              {
                echo "## 上游同步失败"
                echo
                echo "存在未授权的上游冲突，或 merge 没有留下可提交的状态。"
                echo "本次没有推送更新；请处理冲突后再同步。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Restore local sync controls
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          # 这些文件属于本 fork 的同步控制面。上游删除或改写时，按 BASE 恢复。
          git checkout "$BASE_SHA" -- \
            scripts/apply_local_overrides.py \
            scripts/keepalive.py \
            scripts/resolve_sync_conflicts.py \
            tests/test_local_overrides.py \
            tests/test_sync_integration.py
          python3 scripts/apply_local_overrides.py --base-sha "$BASE_SHA"

      - name: Stage local compatibility adjustment
        id: candidate
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        shell: bash
        run: |
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::准备测试前 index 仍有未解决冲突，拒绝继续。"
            exit 1
          fi
          git add --update -- app/sender.py
          if ! git diff --cached --check; then
            echo "::error::候选提交存在空白错误，拒绝测试。"
            exit 1
          fi
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests before publishing the update
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        run: python -m pytest -q

      - name: Verify final local tree
        if: steps.merge.outputs.merged == 'true' || steps.check.outputs.validate == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          python3 scripts/apply_local_overrides.py --base-sha "$BASE_SHA" --verify-only
          if [[ -n "$(git diff --name-only)" ]]; then
            echo "::error::测试产生了未预期的 tracked 工作区改动，拒绝发布。"
            git diff --name-only
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo "::error::测试产生了未预期的未跟踪文件，拒绝发布："
            echo "$untracked"
            exit 1
          fi
          if [[ "$(git write-tree)" != "$CANDIDATE_TREE" ]]; then
            echo "::error::测试后 index tree 与候选 tree 不一致，拒绝发布。"
            exit 1
          fi

      - name: Commit tested merge
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        run: |
          # 候选 tree 已在测试前写入 index；测试后只允许它保持不变。
          CANDIDATE_TREE="${{ steps.candidate.outputs.tree }}"
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::最终提交不是未完成的 upstream merge，拒绝发布。"
            exit 1
          fi
          for path in \
            scripts/apply_local_overrides.py \
            scripts/keepalive.py \
            scripts/resolve_sync_conflicts.py \
            tests/test_local_overrides.py \
            tests/test_sync_integration.py; do
            git cat-file -e ":$path" || {
              echo "::error::最终 index 缺少本地同步文件: $path"
              exit 1
            }
          done
          git commit --no-edit
          if [[ "$(git rev-parse HEAD^{tree})" != "$CANDIDATE_TREE" ]]; then
            echo "::error::最终 commit tree 与测试候选 tree 不一致，拒绝发布。"
            exit 1
          fi

      - name: Publish tested update
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        run: |
          git fetch --prune origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error::main 在测试期间发生变化，本次拒绝推送，不使用强推覆盖。"
            exit 1
          fi
          git push origin HEAD:main
          {
            echo "## 上游同步完成"
            echo
            echo "上游更新已经通过测试并推送到 main。"
          } >> "$GITHUB_STEP_SUMMARY"
